<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">{{ app_name }}</div>
        <nav class="nav">
          <a href="/">仪表盘</a>
          <a href="/channels">渠道</a>
          <a href="/extractors">余额提取器</a>
          <a href="/notifications">通知</a>
          <a href="/alerts">告警</a>
          <form method="post" action="/logout">
            <button class="logout-button" type="submit">退出登录</button>
          </form>
        </nav>
      </aside>
      <main class="content">
        {% if flash %}
          <div class="flash {{ flash.level }}">{{ flash.message }}</div>
        {% endif %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
